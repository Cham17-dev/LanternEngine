name: Lantern HDR16 port

on:
  push:
    branches: [lantern-HDR16, lantern-HDR16-beta]
    paths: ['ports/lantern/**', 'launcher/**', 'engine/**', 'README.md', '.github/workflows/lantern-psychov30.yml']
  # A release published on GitHub (tag v<version>, e.g. v0.9.37-beta.1): built with that
  # version, its package, launcher and package.json attached to it (job publish).
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      baseline_check:
        description: Also compile the unmodified pinned Lantern baseline first
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Awakenchan/LanternEngine
          ref: d901fbd2ea4bea114b37c26a2a9278d1e97f7b46
          path: upstream-lantern
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/SPIRV-Cross
          ref: 300681bbcb8365a8d1eacdacdbdd0249bbf1d6b1
          path: .ci/spirv-cross
          sparse-checkout: include
          persist-credentials: false
      # RenoDX's shader library, the reference of the color table's gamut bridge.
      - uses: actions/checkout@v4
        with:
          repository: clshortfuse/renodx
          ref: b6b32f47789ff9d0e640a0e0db6c9421b5397f34
          path: .ci/renodx
          sparse-checkout: src/shaders
          persist-credentials: false
      # Lantern 0.9.37 and later hold the engine's full source in engine/.
      - name: Engine source and patches
        run: |
          cp -r upstream-lantern/engine engine-src
          python3 ports/lantern/prepare.py engine-src upstream-lantern
      - name: Install shader tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools spirv-tools spirv-cross libglm-dev g++
      - name: Compile and validate registered shaders
        run: python3 ports/lantern/shader_check.py engine-src
      - name: Linear-light numerical regression
        working-directory: engine-src
        env:
          SPIRV_CROSS_INCLUDE: ${{ github.workspace }}/.ci/spirv-cross/include
        run: python3 -I docs/hdr-tools/upscale_transfer_check/run.py
      - name: Gamut bridge against RenoDX
        working-directory: engine-src
        env:
          SPIRV_CROSS_INCLUDE: ${{ github.workspace }}/.ci/spirv-cross/include
          RENODX_DIR: ${{ github.workspace }}/.ci/renodx
        run: python3 -I docs/hdr-tools/gamut_bridge_check/run.py
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Awakenchan/LanternEngine
          ref: d901fbd2ea4bea114b37c26a2a9278d1e97f7b46
          path: upstream-lantern
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The version the launcher reports and its updater compares with the releases' tags: a
      # release's tag, else ports/lantern/VERSION.
      - name: Release version
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $v = if ($env:TAG) { $env:TAG } else { Get-Content ports/lantern/VERSION -TotalCount 1 }
          $v = $v.Trim().TrimStart('v', 'V')
          # 0.9.37, 0.9.37-beta.2, or an HDR16 fix of that Lantern version: 0.9.37.1(-beta.1).
          if ($v -notmatch '^\d+\.\d+\.\d+(\.\d+)?(-[0-9A-Za-z.]+)?$') { throw "Unexpected version '$v'" }
          "full=$v" >> $env:GITHUB_OUTPUT
          "number=$(($v -split '-')[0])" >> $env:GITHUB_OUTPUT
          Write-Output "Version $v"
      # Lantern 0.9.37 and later hold the engine's full source in engine/: a copy of it.
      - name: Lantern engine source
        shell: pwsh
        run: Copy-Item upstream-lantern/engine engine-src -Recurse
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: git patch binutils
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p python:p
            vulkan-headers:p vulkan-loader:p vulkan-memory-allocator:p glslang:p
            sdl3:p fmt:p boost:p robin-map:p xxhash:p ffmpeg:p zydis:p
            spirv-tools:p spirv-headers:p spirv-cross:p
            protobuf:p openssl:p zlib:p miniupnpc:p nlohmann-json:p
      - name: Build unmodified Lantern baseline
        if: github.event_name == 'workflow_dispatch' && inputs.baseline_check
        shell: msys2 {0}
        working-directory: engine-src
        env:
          BB_LTO: 'OFF'
          BB_PGO: 'off'
          BB_JOBS: '2'
        run: |
          export CFLAGS=-Wno-error=unused-but-set-global
          export CXXFLAGS="-include $(cygpath -m "$PWD/gpu/win_compat.h")"
          bash build.sh
      - name: Apply separate HDR16 patches
        run: python ports/lantern/prepare.py engine-src upstream-lantern
      # Link-time optimization on, as Lantern's own builds (build.sh's default).
      - name: Build HDR engine and settings tests
        shell: msys2 {0}
        working-directory: engine-src
        env:
          BB_LTO: 'ON'
          BB_PGO: 'off'
          BB_JOBS: '4'
        run: |
          export CFLAGS=-Wno-error=unused-but-set-global
          export CXXFLAGS="-include $(cygpath -m "$PWD/gpu/win_compat.h")"
          bash build.sh
          ninja -C out/gpu -j2 settings-test
          out/gpu/settings-test.exe
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build launcher with HDR16
        run: >-
          dotnet publish launcher/windows/BloodborneLauncher/BloodborneLauncher.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.number }}
          -p:InformationalVersion=${{ steps.version.outputs.full }}
          -o launcher-port
      - name: Verify launcher paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory launcher-paths-check | Out-Null
          Copy-Item ports/lantern/launcher_paths_check.cs launcher-paths-check/Program.cs
          Copy-Item launcher/windows/BloodborneLauncher/Core/Paths.cs launcher-paths-check/Paths.cs
          Copy-Item launcher/windows/Shared/SourceStamp.cs launcher-paths-check/SourceStamp.cs
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup></Project>' | Set-Content launcher-paths-check/Check.csproj
          dotnet run --project launcher-paths-check/Check.csproj
      - name: Package engine overlay and runtime DLLs
        shell: msys2 {0}
        run: |
          export BB_CLANG_BIN="$(cygpath -w /clang64/bin)"
          python ports/lantern/package_engine.py engine-src stage launcher-port
      - name: Assemble complete matching runtime
        env:
          BB_RELEASE_VERSION: ${{ steps.version.outputs.full }}
        run: python ports/lantern/distribution.py engine-src stage distribution runtime-downloads
      - name: Smoke check shipped preparation runtime
        run: python ports/lantern/package_check.py distribution
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-psychov30-package
          path: distribution/
      # A release's files, as the launcher's updater reads them (Updater.cs): the package zip,
      # Lantern Engine.exe on its own and package.json.
      - name: Release files
        if: github.event_name == 'release'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.full }}
        run: |
          New-Item -ItemType Directory release-files, pack | Out-Null
          Copy-Item distribution pack/LanternEngine-HDR16 -Recurse
          7z a -tzip -mx=5 "release-files/LanternEngine-HDR16-v$env:VERSION-win64.zip" ./pack/LanternEngine-HDR16
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          Copy-Item "distribution/Lantern Engine.exe", distribution/package.json release-files/
          Get-ChildItem release-files | Format-Table Name, Length
      - if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: lantern-psychov30-release
          path: release-files/
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lantern-build-log
          path: engine-src/out/gpu-build.log
  publish:
    if: github.event_name == 'release'
    needs: [shaders, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lantern-psychov30-release
          path: release-files
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release-files/* --clobber --repo "$GITHUB_REPOSITORY"
